name: Release

# Publishes the version in ranksphere.php as a GitHub release: either "Run workflow" on main (the
# workflow creates the tag v<version>) or pushing that tag. Versions with a suffix
# (1.0.0-alpha.1, -beta.1, -rc.1) are pre-releases. RankSphere reads the releases and offers them to
# sites by channel (GET /api/wordpress/v1/plugin).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Checks (lint, static analysis, unit tests)
        run: composer check
      - name: Version and tag
        run: |
          version="$(php bin/release-meta.php | php -r 'echo json_decode(stream_get_contents(STDIN))->version;')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Releases are made from main." >&2
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
              echo "v${version} exists already – raise the version first." >&2
              exit 1
            fi
          elif [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build
        run: |
          bash bin/build-zip.sh --wporg
          bash bin/build-zip.sh
          php bin/release-meta.php > build/ranksphere.json
          php bin/release-notes.php "$VERSION" > build/notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          # --target creates the tag on this commit when it does not exist yet (Run workflow).
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            build/ranksphere.zip build/ranksphere-wporg.zip build/ranksphere.json \
            --title "RankSphere ${VERSION}" --notes-file build/notes.md "${flags[@]}"
