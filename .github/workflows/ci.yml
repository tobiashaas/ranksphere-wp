name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer check-versions
      - run: composer lint
      - run: composer analyse

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test:unit

  integration:
    name: WordPress ${{ matrix.wp }} · ${{ matrix.seo.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported and current WordPress; each SEO plugin loaded on its own.
        wp: ['6.6', 'latest']
        seo:
          - { name: 'no SEO plugin', slug: '', file: '' }
          - { name: 'Yoast SEO', slug: 'wordpress-seo', file: 'wordpress-seo/wp-seo.php' }
          - { name: 'Rank Math', slug: 'seo-by-rank-math', file: 'seo-by-rank-math/rank-math.php' }
          - { name: 'SEOPress', slug: 'wp-seopress', file: 'wp-seopress/seopress.php' }
          - { name: 'All in One SEO', slug: 'all-in-one-seo-pack', file: 'all-in-one-seo-pack/all_in_one_seo_pack.php' }
          - { name: 'The SEO Framework', slug: 'autodescription', file: 'autodescription/autodescription.php' }
          - { name: 'Slim SEO', slug: 'slim-seo', file: 'slim-seo/slim-seo.php' }
        exclude:
          # Current SEO plugins require newer WordPress than 6.6 – they run on latest only.
          - wp: '6.6'
            seo: { name: 'Yoast SEO', slug: 'wordpress-seo', file: 'wordpress-seo/wp-seo.php' }
          - wp: '6.6'
            seo: { name: 'Rank Math', slug: 'seo-by-rank-math', file: 'seo-by-rank-math/rank-math.php' }
          - wp: '6.6'
            seo: { name: 'SEOPress', slug: 'wp-seopress', file: 'wp-seopress/seopress.php' }
          - wp: '6.6'
            seo: { name: 'All in One SEO', slug: 'all-in-one-seo-pack', file: 'all-in-one-seo-pack/all_in_one_seo_pack.php' }
          - wp: '6.6'
            seo: { name: 'The SEO Framework', slug: 'autodescription', file: 'autodescription/autodescription.php' }
          - wp: '6.6'
            seo: { name: 'Slim SEO', slug: 'slim-seo', file: 'slim-seo/slim-seo.php' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start WordPress
        run: npx wp-env start
        env:
          WP_ENV_CORE: ${{ matrix.wp == 'latest' && 'WordPress/WordPress' || format('WordPress/WordPress#{0}', matrix.wp) }}
      - name: Install the SEO plugin (tests environment, not activated – the bootstrap loads it)
        if: matrix.seo.slug != ''
        run: npx wp-env run tests-cli wp plugin install ${{ matrix.seo.slug }}
      - name: Integration tests
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/${{ github.event.repository.name }} env RANKSPHERE_TEST_SEO_PLUGIN=${{ matrix.seo.file }} vendor/bin/phpunit -c phpunit.xml.dist

  plugin-check:
    name: Plugin Check (WordPress.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      # The WordPress.org variant: without the updater, which WordPress.org does not allow.
      - name: Build release directory
        run: bash bin/build-zip.sh --wporg
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/ranksphere
          slug: ranksphere

  zip:
    name: Release zip
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: bash bin/build-zip.sh --wporg
      - run: bash bin/build-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ranksphere-zip
          path: |
            build/ranksphere.zip
            build/ranksphere-wporg.zip
